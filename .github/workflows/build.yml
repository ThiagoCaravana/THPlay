name: Gerar APK THPlay

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar Projeto e APK com PWABuilder
        run: |
          npm install -g @pwabuilder/cli
          pwa-builder https://raw.githack.com/${{ github.repository }}/main/manifest.json -o app_output -p android

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: THPlay-APK
          path: app_output/**/*.apk
          

name: Gerar APK THPlay

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Gerador de APK
        run: npm install -g @bubblewrap/cli

      - name: Criar Projeto Android THPlay
        run: |
          npx @bubblewrap/cli init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json --directory=android_app
          cd android_app
          npx @bubblewrap/cli build --skipSigning

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: THPlay-APK
          path: android_app/*.apk
          

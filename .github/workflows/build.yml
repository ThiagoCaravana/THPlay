name: Gerar APK THPlay

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Criar Projeto Android Nativo com Permissões de Rede
        run: |
          cordova create thplay_app com.thplay.app "THPlay"
          cd thplay_app
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist
          rm -rf www/*
          cp ../thplay.html www/index.html

      - name: Liberar Conexões HTTP no Android
        run: |
          cd thplay_app
          sed -i 's/<content src="index.html" \/>/<content src="index.html" \/>\n    <access origin="*" \/>\n    <allow-navigation href="*" \/>\n    <allow-intent href="*" \/>/' config.xml

      - name: Compilar APK Android
        run: |
          cd thplay_app
          cordova build android --debug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: THPlay-APK
          path: thplay_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          

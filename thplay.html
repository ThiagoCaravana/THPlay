<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THPlay</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#E50914',
                        darkBg: '#0b0d12',
                        cardBg: '#131722',
                    }
                }
            }
        }
    </script>
    <!-- HLS.js para reprodução de transmissões ao vivo e HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0d12; color: #fff; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0d12; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-cardBg border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="bg-primary text-white font-black px-2.5 py-0.5 rounded text-lg tracking-wider">TH</div>
            <span class="text-xl font-black tracking-tight">TH<span class="text-primary">PLAY</span></span>
        </div>
        <button onclick="openConfigModal()" class="bg-primary hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow">
            <i class="fa-solid fa-plus"></i>
            <span>MINHA LISTA</span>
        </button>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 flex flex-col md:flex-row p-3 gap-3 max-w-[1600px] w-full mx-auto">
        
        <!-- Player de Vídeo -->
        <div class="w-full md:w-2/3 lg:w-3/4 flex flex-col space-y-2">
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800 flex items-center justify-center">
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 bg-gray-950 p-4 text-center">
                    <i class="fa-solid fa-circle-play text-6xl mb-3 text-primary animate-pulse"></i>
                    <p class="text-base font-bold text-gray-200">Selecione um canal, filme ou série</p>
                    <p class="text-xs text-gray-500 mt-1">THPlay IPTV</p>
                </div>
            </div>

            <!-- Dados do Canal/Filme Selecionado -->
            <div class="bg-cardBg p-3 rounded-xl border border-gray-800 flex items-center justify-between">
                <div class="min-w-0 flex-1 pr-2">
                    <h2 id="currentChannelName" class="text-sm font-bold text-white truncate">Nenhum conteúdo selecionado</h2>
                    <p id="currentChannelGroup" class="text-[11px] text-primary font-semibold mt-0.5">THPlay Player</p>
                </div>
                <button onclick="toggleFullscreen()" class="bg-gray-800 hover:bg-gray-700 p-2 rounded-lg text-gray-300 transition flex-shrink-0">
                    <i class="fa-solid fa-expand text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Painel Lateral Estilo SkyPlayer (3 Blocos) -->
        <div class="w-full md:w-1/3 lg:w-1/4 flex flex-col bg-cardBg border border-gray-800 rounded-xl overflow-hidden h-[480px] md:h-[calc(100vh-100px)]">
            
            <!-- Três Categorias Principais -->
            <div class="grid grid-cols-3 gap-1 p-2 bg-black/40 border-b border-gray-800">
                <button onclick="setTab('live')" id="tab-live" class="flex flex-col items-center justify-center p-2 rounded-lg bg-primary text-white transition">
                    <i class="fa-solid fa-tv text-xs mb-1"></i>
                    <span class="text-[10px] font-bold uppercase">Ao Vivo</span>
                    <span id="count-live" class="text-[9px] opacity-75">0</span>
                </button>
                <button onclick="setTab('movie')" id="tab-movie" class="flex flex-col items-center justify-center p-2 rounded-lg bg-gray-800 text-gray-400 hover:bg-gray-700 transition">
                    <i class="fa-solid fa-film text-xs mb-1"></i>
                    <span class="text-[10px] font-bold uppercase">Filmes</span>
                    <span id="count-movie" class="text-[9px] opacity-75">0</span>
                </button>
                <button onclick="setTab('series')" id="tab-series" class="flex flex-col items-center justify-center p-2 rounded-lg bg-gray-800 text-gray-400 hover:bg-gray-700 transition">
                    <i class="fa-solid fa-clapperboard text-xs mb-1"></i>
                    <span class="text-[10px] font-bold uppercase">Séries</span>
                    <span id="count-series" class="text-[9px] opacity-75">0</span>
                </button>
            </div>

            <!-- Busca -->
            <div class="p-2 border-b border-gray-800">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="filterChannels()" placeholder="Pesquisar..." 
                        class="w-full bg-black/60 border border-gray-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-primary">
                </div>
            </div>

            <!-- Lista de Itens -->
            <div id="channelsList" class="flex-1 overflow-y-auto p-2 space-y-1 divide-y divide-gray-800/40">
                <div class="text-center py-12 text-gray-500 px-4">
                    <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
                    <p class="text-xs">Nenhuma lista carregada.</p>
                    <button onclick="openConfigModal()" class="mt-3 bg-primary text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition">
                        Inserir Link M3U
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal para Inserir Link -->
    <div id="configModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-link text-primary"></i>
                    <span>Configurar Lista IPTV</span>
                </h3>
                <button onclick="closeConfigModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-3">
                <label class="text-[11px] text-gray-400 font-semibold uppercase">Cole a URL do seu Link M3U</label>
                <textarea id="m3uUrlInput" rows="3" placeholder="http://servidor.com/get.php?username=...&password=...&type=m3u_plus"
                    class="w-full bg-black/60 border border-gray-700 rounded-xl p-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-primary resize-none"></textarea>

                <div id="loadStatus" class="text-[11px] text-center font-medium hidden"></div>

                <button onclick="loadList()" class="w-full bg-primary hover:bg-red-700 text-white text-xs font-bold py-2.5 rounded-xl transition shadow flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>CARREGAR NO THPLAY</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script do App -->
    <script>
        let rawChannels = [], liveChannels = [], movieChannels = [], seriesChannels = [];
        let currentTab = 'live';
        let hls = null;

        const PROXIES = [
            (url) => url,
            (url) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
            (url) => 'https://corsproxy.io/?' + encodeURIComponent(url)
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('thplay_m3u_url');
            if (savedUrl) {
                document.getElementById('m3uUrlInput').value = savedUrl;
                autoLoad(savedUrl);
            } else {
                openConfigModal();
            }
        });

        function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }

        function setStatus(msg, isErr = false) {
            const el = document.getElementById('loadStatus');
            el.classList.remove('hidden', 'text-red-500', 'text-yellow-500');
            el.classList.add(isErr ? 'text-red-500' : 'text-yellow-500');
            el.innerText = msg;
        }

        async function loadList() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return alert('Cole o link da sua lista!');
            localStorage.setItem('thplay_m3u_url', url);
            await autoLoad(url);
        }

        async function autoLoad(url) {
            setStatus("Conectando ao servidor...");
            for (let i = 0; i < PROXIES.length; i++) {
                try {
                    const res = await fetch(PROXIES[i](url));
                    if (res.ok) {
                        const txt = await res.text();
                        if (txt.includes('#EXTINF') || txt.includes('http')) {
                            parseM3U(txt);
                            setStatus("Lista carregada com sucesso!");
                            setTimeout(closeConfigModal, 600);
                            return;
                        }
                    }
                } catch (e) {}
            }
            setStatus("Erro ao carregar a lista. Verifique a URL.", true);
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            liveChannels = []; movieChannels = []; seriesChannels = [];
            let cur = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    cur = {};
                    const nameMatch = line.match(/,(.+)$/);
                    cur.name = nameMatch ? nameMatch[1].trim() : 'Sem Nome';
                    
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    cur.logo = logoMatch ? logoMatch[1] : null;

                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    cur.group = groupMatch ? groupMatch[1] : 'Geral';
                } else if (line && !line.startsWith('#')) {
                    if (cur.name) {
                        cur.url = line;
                        const g = (cur.group || '').toLowerCase();
                        if (g.includes('filme') || g.includes('vod')) {
                            movieChannels.push(cur);
                        } else if (g.includes('série') || g.includes('series')) {
                            seriesChannels.push(cur);
                        } else {
                            liveChannels.push(cur);
                        }
                        cur = {};
                    }
                }
            }

            document.getElementById('count-live').innerText = liveChannels.length;
            document.getElementById('count-movie').innerText = movieChannels.length;
            document.getElementById('count-series').innerText = seriesChannels.length;

            renderList();
        }

        function setTab(tab) {
            currentTab = tab;
            ['live', 'movie', 'series'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex flex-col items-center justify-center p-2 rounded-lg bg-primary text-white transition";
                } else {
                    btn.className = "flex flex-col items-center justify-center p-2 rounded-lg bg-gray-800 text-gray-400 hover:bg-gray-700 transition";
                }
            });
            renderList();
        }

        function getActiveList() {
            if (currentTab === 'live') return liveChannels;
            if (currentTab === 'movie') return movieChannels;
            return seriesChannels;
        }

        function renderList() {
            const container = document.getElementById('channelsList');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const list = getActiveList().filter(item => 
                item.name.toLowerCase().includes(query) || item.group.toLowerCase().includes(query)
            );

            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-500 text-xs">Nenhum item encontrado.</div>`;
                return;
            }

            const html = list.slice(0, 250).map(ch => `
                <div onclick='playStream(${JSON.stringify(ch.url)}, ${JSON.stringify(ch.name)}, ${JSON.stringify(ch.group)})' 
                     class="flex items-center space-x-2.5 p-2 rounded-lg hover:bg-gray-800/80 cursor-pointer transition group">
                    <div class="w-8 h-8 bg-black rounded-md flex items-center justify-center overflow-hidden flex-shrink-0 border border-gray-800">
                        ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-cover" onerror="this.style.display='none'">` : `<i class="fa-solid fa-play text-gray-600 text-[10px]"></i>`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-semibold text-gray-200 truncate group-hover:text-primary transition">${ch.name}</p>
                        <p class="text-[10px] text-gray-500 truncate">${ch.group}</p>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function filterChannels() { renderList(); }

        function playStream(url, name, group) {
            document.getElementById('currentChannelName').innerText = name;
            document.getElementById('currentChannelGroup').innerText = group;
            document.getElementById('playerPlaceholder').classList.add('hidden');

            const video = document.getElementById('videoPlayer');
            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported() && (url.includes('.m3u8') || !url.includes('.'))) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            } else {
                video.src = url;
                video.load();
                video.play().catch(() => {});
            }
        }

        function toggleFullscreen() {
            const v = document.getElementById('videoPlayer');
            if (v.requestFullscreen) v.requestFullscreen();
            else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
        }
    </script>
</body>
</html>
